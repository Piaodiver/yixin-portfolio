<title>墨分五色</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
/* ══════════════════════════════════════════════════════════════
   墨分五色 — five design directions for yixin-portfolio
   The chrome commits to one world on purpose: a dark viewing room,
   so five specimens with five different grounds all read as framed
   work rather than as five competing page themes.
   ══════════════════════════════════════════════════════════════ */

:root{
  color-scheme: dark;
  --ch-bg:      #0D100E;
  --ch-panel:   #141814;
  --ch-line:    #252B25;
  --ch-line-hi: #3A423A;
  --ch-text:    #E6E3D8;
  --ch-dim:     #878E84;
  --ch-dimmer:  #5D645B;
  --ch-jade:    #7FA893;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: Inter, system-ui, -apple-system, sans-serif;
}

*{ box-sizing: border-box; }
body{ background: var(--ch-bg); color: var(--ch-text); font-family: var(--sans); }
::selection{ background: var(--ch-jade); color: #0D100E; }
a{ color: inherit; }
:focus-visible{ outline: 2px solid var(--ch-jade); outline-offset: 3px; }

/* ── rail ─────────────────────────────────────────────────── */
.rail{
  position: sticky; top: 0; z-index: 90;
  background: rgba(13,16,14,.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--ch-line);
}
.rail-in{
  max-width: 1240px; margin: 0 auto; padding: 0 24px;
  display: flex; align-items: stretch; gap: 28px;
  min-height: 58px;
}
.brand{
  display: flex; align-items: center; gap: 10px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ch-dimmer); white-space: nowrap;
}
.brand b{ color: var(--ch-text); font-weight: 500; letter-spacing: .3em; }
.tabs{ display: flex; align-items: stretch; gap: 2px; flex: 1; overflow-x: auto; }
.tab{
  appearance: none; background: none; border: 0; cursor: pointer;
  padding: 0 14px; display: flex; flex-direction: column; justify-content: center; gap: 3px;
  border-bottom: 2px solid transparent; color: var(--ch-dim);
  transition: color .18s ease, border-color .18s ease;
  white-space: nowrap;
}
.tab-no{ font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; color: var(--ch-dimmer); transition: color .18s ease; }
.tab-zh{ font-size: 14px; letter-spacing: .06em; }
.tab:hover{ color: var(--ch-text); }
.tab[aria-selected="true"]{ color: var(--ch-text); border-bottom-color: var(--ch-jade); }
.tab[aria-selected="true"] .tab-no{ color: var(--ch-jade); }

/* ── spec strip ───────────────────────────────────────────── */
.spec-strip{ border-bottom: 1px solid var(--ch-line); background: var(--ch-panel); }
.spec-in{
  max-width: 1240px; margin: 0 auto; padding: 14px 24px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
}
.spec-cell{ display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.spec-k{
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--ch-dimmer);
}
.spec-v{ font-size: 12.5px; line-height: 1.45; color: var(--ch-dim); }
.spec-cell:first-child .spec-v{ color: var(--ch-text); }

/* ── stage ────────────────────────────────────────────────── */
#stage{ position: relative; }
.spm{ position: relative; overflow: hidden; }
.spm-canvas{ position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.wrap{ max-width: 1120px; margin: 0 auto; padding: 0 40px; position: relative; z-index: 2; }
@media (max-width: 720px){ .wrap{ padding: 0 22px; } }

/* ── annotation band ──────────────────────────────────────── */
.notes{ background: var(--ch-bg); border-top: 1px solid var(--ch-line); }
.notes-in{ max-width: 1240px; margin: 0 auto; padding: 30px 24px 44px; }
.notes-h{
  font-family: var(--mono); font-size: 10px; letter-spacing: .22em;
  text-transform: uppercase; color: var(--ch-jade); margin: 0 0 18px;
}
.notes-grid{ display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px 40px; }
.note{ display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
.note-i{ font-family: var(--mono); font-size: 10px; color: var(--ch-dimmer); padding-top: 3px; }
.note-b{ font-size: 13px; line-height: 1.62; color: var(--ch-dim); margin: 0; }
.note-b b{ color: var(--ch-text); font-weight: 500; }
.note-b code{
  font-family: var(--mono); font-size: 11.5px; color: var(--ch-jade);
  background: rgba(127,168,147,.09); padding: 1px 5px; border-radius: 3px;
}
@media (max-width: 780px){
  .notes-grid{ grid-template-columns: 1fr; }
  .spec-in{ grid-template-columns: repeat(2, 1fr); gap: 16px 24px; }
}

/* ══ shared specimen primitives (overridden per direction) ══ */
.sp-nav{ display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.sp-navlinks{ display: flex; gap: 26px; }
.sp-metrics{ display: grid; grid-template-columns: repeat(4, 1fr); }
.sp-lanes{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; }
@media (max-width: 860px){
  .sp-lanes{ grid-template-columns: 1fr; }
  .sp-metrics{ grid-template-columns: repeat(2, 1fr); }
  .sp-navlinks{ display: none; }
}
.num{ font-variant-numeric: tabular-nums; }

/* ═══════════════════════════════════════════════════════════
   01 · 墨屏  INK SCREEN — ink as light on a dark ground
   ═══════════════════════════════════════════════════════════ */
.v-screen{
  --bg:#0A0C0B; --panel:#101413; --line:#1F2523; --line-hi:#2E3733;
  --tx:#EAE7DC; --tx2:#9AA29B; --tx3:#666E68;
  --jade:#7DB49B; --cyan:#6E9BB8; --ochre:#C4794A;
  background: var(--bg); color: var(--tx);
}
.v-screen .hero{ padding: 74px 0 60px; }
.v-screen .eyebrow{
  font-family: var(--mono); font-size: 10px; letter-spacing: .26em;
  text-transform: uppercase; color: var(--jade);
  display: flex; align-items: center; gap: 10px;
}
.v-screen .eyebrow::before{
  content:""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--jade); box-shadow: 0 0 10px 1px rgba(125,180,155,.75);
  animation: pulse 3.4s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:.35} 50%{opacity:1} }
.v-screen .sp-nav{ padding: 20px 0; border-bottom: 1px solid var(--line); }
.v-screen .sp-navlinks{ font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--tx3); }
.v-screen .sp-navlinks span{ transition: color .2s ease; cursor: default; }
.v-screen .sp-navlinks span:hover{ color: var(--jade); }
.v-screen .mark{ font-family: var(--mono); font-size: 12px; letter-spacing: .3em; color: var(--tx); }
.v-screen .hero-grid{ display: grid; grid-template-columns: 1fr 220px; gap: 56px; align-items: center; }
.v-screen .name{
  font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
  font-size: clamp(56px, 8.4vw, 116px); line-height: .92; letter-spacing: -.015em;
  margin: 22px 0 0; text-wrap: balance;
}
.v-screen .name em{ font-style: italic; color: var(--jade); }
.v-screen .role{
  font-family: var(--mono); font-size: 11.5px; letter-spacing: .28em;
  text-transform: uppercase; color: var(--tx2); margin: 20px 0 0;
}
.v-screen .tagline{
  max-width: 54ch; font-size: 16.5px; line-height: 1.72; font-weight: 300;
  color: var(--tx2); margin: 26px 0 0;
}
.v-screen .portrait{
  position: relative; width: 200px; height: 200px; border-radius: 50%;
  justify-self: end;
}
.v-screen .portrait img{
  width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  filter: grayscale(1) contrast(1.06) brightness(.94);
  border: 1px solid var(--line-hi);
}
.v-screen .portrait::after{
  content:""; position: absolute; inset: -26px; border-radius: 50%;
  background: radial-gradient(circle, rgba(125,180,155,.22), transparent 68%);
  z-index: -1;
}
.v-screen .scan{
  position: absolute; left: 0; right: 0; height: 1px; top: 0;
  background: linear-gradient(90deg, transparent, rgba(125,180,155,.85), transparent);
  animation: scan 2.6s cubic-bezier(.4,0,.2,1) .35s 1 both;
}
@keyframes scan{ from{ transform: translateY(0); opacity:0 } 12%{opacity:1} to{ transform: translateY(58vh); opacity:0 } }
.v-screen .sp-metrics{ border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.v-screen .metric{ padding: 26px 0; border-right: 1px solid var(--line); }
.v-screen .metric:last-child{ border-right: 0; }
.v-screen .metric-v{
  font-family: "Instrument Serif", Georgia, serif; font-size: 40px; line-height: 1; color: var(--tx);
}
.v-screen .metric-l{
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--tx3); margin-top: 11px;
}
.v-screen .metric-bar{ height: 2px; width: 26px; background: var(--jade); margin-top: 14px; opacity: .5; }
.v-screen .lanes-sec{ padding: 62px 0 76px; }
.v-screen .sec-head{ display: flex; align-items: baseline; gap: 16px; margin-bottom: 30px; }
.v-screen .sec-no{ font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--jade); }
.v-screen .sec-t{ font-family: "Instrument Serif", Georgia, serif; font-size: 27px; }
.v-screen .sp-lanes{ background: var(--line); border: 1px solid var(--line); }
.v-screen .lane{
  background: var(--panel); padding: 28px 24px 30px;
  transition: background .28s ease;
}
.v-screen .lane:hover{ background: #141A18; }
.v-screen .lane-no{ font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--tx3); }
.v-screen .lane-t{ font-family: "Instrument Serif", Georgia, serif; font-size: 24px; margin: 14px 0 0; color: var(--tx); }
.v-screen .lane-c{ font-size: 14px; line-height: 1.62; color: var(--tx2); margin: 12px 0 0; font-weight: 300; }
.v-screen .lane-e{
  font-family: var(--mono); font-size: 10.5px; line-height: 1.7; color: var(--tx3);
  margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line);
}
.v-screen .tags{ display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
.v-screen .tag{
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em;
  padding: 4px 8px; border: 1px solid var(--line-hi); border-radius: 2px; color: var(--tx3);
}

/* ═══════════════════════════════════════════════════════════
   02 · 落墨  INK DROP — austere paper, one playable fluid
   ═══════════════════════════════════════════════════════════ */
.v-drop{
  --bg:#FAF8F3; --line:#DCD7C9; --tx:#161915; --tx2:#5C6159; --tx3:#8B9086;
  --ink:#2C3A46;
  background: var(--bg); color: var(--tx);
}
.v-drop .spm-canvas{ mix-blend-mode: multiply; }
.v-drop .sp-nav{ padding: 26px 0; }
.v-drop .mark{ font-family: var(--mono); font-size: 11px; letter-spacing: .34em; text-transform: uppercase; }
.v-drop .sp-navlinks{ font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--tx3); }
.v-drop .hero{ padding: 96px 0 88px; }
.v-drop .name{
  font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300;
  font-size: clamp(64px, 11vw, 150px); line-height: .9; letter-spacing: -.02em; margin: 0;
}
.v-drop .role{
  font-family: var(--mono); font-size: 11px; letter-spacing: .34em; text-transform: uppercase;

}

  font-family: "Cormorant Garamond", Georgia, serif; font-weight: 300;

}
.v-drop .hint{

  margin: 52px 0 0; display: flex; align-items: center; gap: 9px;
}
.v-drop .hint::before{ content:""; width: 22px; height: 1px; background: var(--tx3); }
.v-drop .thumb{ width: 60px; height: 60px; border-radius: 50%; object-fit: cover; filter: grayscale(1) contrast(1.04); opacity: .82; }
.v-drop .sp-metrics{ border-top: 1px solid var(--line); gap: 0; }
.v-drop .metric{ padding: 24px 0 26px; }
.v-drop .metric-v{ font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: 44px; line-height: 1; }
.v-drop .metric-l{ font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--tx3); margin-top: 9px; }
.v-drop .lanes-sec{ padding: 70px 0 40px; }
.v-drop .sp-lanes{ gap: 0; border-top: 1px solid var(--line); }
.v-drop .lane{ padding: 30px 30px 34px 0; border-right: 1px solid var(--line); }
.v-drop .lane:last-child{ border-right: 0; padding-right: 0; }
.v-drop .lane-no{ font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--tx3); }
.v-drop .lane-t{ font-family: "Cormorant Garamond", Georgia, serif; font-weight: 400; font-size: 30px; margin: 12px 0 0; }
.v-drop .lane-c{ font-size: 14px; line-height: 1.68; color: var(--tx2); margin: 12px 0 0; font-weight: 300; max-width: 30ch; }
.v-drop .lane-e{ font-family: var(--mono); font-size: 10px; line-height: 1.75; color: var(--tx3); margin: 16px 0 0; }
.v-drop .statusline{
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; color: var(--tx3);
  padding: 18px 0 30px; border-top: 1px solid var(--line); display: flex; gap: 22px; flex-wrap: wrap;
}
.v-drop .statusline b{ color: var(--tx2); font-weight: 400; }

/* ═══════════════════════════════════════════════════════════
   03 · 笔锋  BRUSHSTROKE — one stroke written by the scroll
   ═══════════════════════════════════════════════════════════ */
.v-brush{
  --bg:#F6F3EA; --line:#DDD8C8; --tx:#1B1E19; --tx2:#5A6157; --tx3:#8A8F82;
  --ink:#232A2E; --ochre:#B5673A;
  background: var(--bg); color: var(--tx);
}
.v-brush .spine{ position: absolute; left: 0; top: 0; width: 96px; height: 100%; pointer-events: none; z-index: 1; mix-blend-mode: multiply; }
.v-brush .wrap{ padding-left: 108px; }
@media (max-width: 860px){ .v-brush .wrap{ padding-left: 22px; } .v-brush .spine{ display: none; } }
.v-brush .sp-nav{ padding: 24px 0; }
.v-brush .mark{ font-family: Fraunces, Georgia, serif; font-size: 17px; font-weight: 500; letter-spacing: .04em; }
.v-brush .sp-navlinks{ font-family: var(--mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--tx3); }
.v-brush .hero{ padding: 64px 0 70px; position: relative; }
.v-brush .hero-canvas{ position: absolute; left: -40px; right: 0; top: 20px; height: 240px; pointer-events: none; mix-blend-mode: multiply; opacity: .9; }
.v-brush .wipe{
  clip-path: inset(0 100% 0 0);
  animation: wipe 1.05s cubic-bezier(.16,.68,.3,1) both;
}
@keyframes wipe{ to{ clip-path: inset(0 -2% 0 0); } }
.v-brush .name{
  font-family: Fraunces, Georgia, serif; font-weight: 400;
  font-size: clamp(54px, 8vw, 108px); line-height: .96; letter-spacing: -.022em;
  margin: 0; position: relative; z-index: 2;
}
.v-brush .role{
  font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
  color: var(--ochre); margin: 22px 0 0;
}
.v-brush .tagline{ font-size: 17px; line-height: 1.75; max-width: 46ch; color: var(--tx2); margin: 26px 0 0; font-weight: 300; }
.v-brush .hero-row{ display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; margin-top: 40px; }
.v-brush .portrait{
  width: 132px; height: 132px; flex: none; border-radius: 50%; overflow: hidden;
  -webkit-mask-image: radial-gradient(circle at 50% 48%, #000 62%, transparent 82%);
          mask-image: radial-gradient(circle at 50% 48%, #000 62%, transparent 82%);
}
.v-brush .portrait img{ width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
.v-brush .sp-metrics{ border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.v-brush .metric{ padding: 24px 0; }
.v-brush .metric-v{ font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 36px; line-height: 1; }
.v-brush .metric-l{ font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--tx3); margin-top: 9px; }
.v-brush .lanes-sec{ padding: 60px 0 70px; }
.v-brush .sec-head{ display: flex; align-items: baseline; gap: 14px; margin-bottom: 28px; }
.v-brush .sec-no{ font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--ochre); }
.v-brush .sec-t{ font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 500; }
.v-brush .sp-lanes{ gap: 0; }
.v-brush .lane{ padding: 26px 28px 30px 26px; border-left: 1px solid var(--line); position: relative; }
.v-brush .lane::before{
  content:""; position: absolute; left: -4px; top: 30px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--ochre); opacity: .85;
}
.v-brush .lane-no{ font-family: var(--mono); font-size: 10px; letter-spacing: .2em; color: var(--tx3); }
.v-brush .lane-t{ font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 22px; margin: 12px 0 0; }
.v-brush .lane-c{ font-size: 14px; line-height: 1.66; color: var(--tx2); margin: 10px 0 0; font-weight: 300; }
.v-brush .lane-e{ font-family: var(--mono); font-size: 10px; line-height: 1.7; color: var(--tx3); margin: 16px 0 0; }

/* ═══════════════════════════════════════════════════════════
   04 · 山水数据  DATA LANDSCAPE — the CV drawn as a survey map
   ═══════════════════════════════════════════════════════════ */
.v-land{
  --bg:#F4F2EB; --line:#D5D1C2; --tx:#191C18; --tx2:#585E55; --tx3:#8A9083;
  --ridge:#2E3A34; --mark:#A8542B;
  background: var(--bg); color: var(--tx);
}
.v-land .sp-nav{ padding: 20px 0; border-bottom: 1px solid var(--line); }
.v-land .mark-l{ font-family: var(--mono); font-size: 11px; letter-spacing: .3em; text-transform: uppercase; }
.v-land .sp-navlinks{ font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--tx3); }
.v-land .map{ position: relative; height: 380px; border-bottom: 1px solid var(--line); overflow: hidden; }
.v-land .map canvas{ position: absolute; inset: 0; width: 100%; height: 100%; }
.v-land .map-over{ position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.v-land .grat{
  position: absolute; inset: 0;
  background-image:
    repeating-linear-gradient(90deg, rgba(46,58,52,.07) 0 1px, transparent 1px 84px),
    repeating-linear-gradient(0deg, rgba(46,58,52,.07) 0 1px, transparent 1px 84px);
}
.v-land .pin{ position: absolute; font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--tx2); }
.v-land .pin::before{
  content:""; position: absolute; left: -13px; top: 4px; width: 7px; height: 7px;
  border: 1px solid var(--mark); border-radius: 50%;
}
.v-land .pin::after{
  content:""; position: absolute; left: -9px; top: 11px; width: 1px; height: 16px; background: var(--mark); opacity: .45;
}
.v-land .pin b{ color: var(--mark); font-weight: 500; }
.v-land .legend{
  position: absolute; right: 20px; bottom: 18px; text-align: right;
  font-family: var(--mono); font-size: 9px; letter-spacing: .14em; color: var(--tx3); line-height: 1.9;
}
.v-land .hero{ padding: 46px 0 42px; display: grid; grid-template-columns: 1fr 150px; gap: 48px; align-items: end; }
.v-land .name{
  font-family: "Instrument Serif", Georgia, serif; font-weight: 400;
  font-size: clamp(48px, 6.6vw, 88px); line-height: .98; letter-spacing: -.01em; margin: 0;
}
.v-land .role{ font-family: var(--mono); font-size: 10.5px; letter-spacing: .28em; text-transform: uppercase; color: var(--mark); margin: 16px 0 0; }
.v-land .tagline{ font-size: 15.5px; line-height: 1.7; max-width: 50ch; color: var(--tx2); margin: 20px 0 0; font-weight: 300; }
.v-land .plate{ border: 1px solid var(--line); padding: 7px 7px 0; background: #FBFAF5; }
.v-land .plate img{ width: 100%; display: block; filter: grayscale(1) contrast(1.05); }
.v-land .plate-cap{ font-family: var(--mono); font-size: 8.5px; letter-spacing: .1em; color: var(--tx3); padding: 7px 0 8px; line-height: 1.6; }
.v-land .sp-metrics{ border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.v-land .metric{ padding: 20px 0; border-right: 1px solid var(--line); }

.v-paper{

.v-paper .sp-nav{ padding: 22px 0; border-bottom: 1px solid var(--hair); }

.v-paper .coord i{ font-style: normal; color: var(--sage); }

.v-paper .name{

}
.v-paper .rule{ height: 1px; background: var(--line); margin: 24px 0; position: relative; }
.v-paper .rule::after{
  content:""; position: absolute; left: 0; top: -1px; height: 3px; width: 46px; background: var(--sage);

}
@keyframes growrule{ from{ width: 0 } to{ width: 46px } }
.v-paper .role{ font-family: var(--mono); font-size: 11px; letter-spacing: .28em; text-transform: uppercase; color: var(--tx2); }
.v-paper .tagline{ font-size: 16.5px; line-height: 1.76; max-width: 52ch; color: var(--tx2); margin: 22px 0 0; font-weight: 300; }

}

.v-paper .metric-v{ font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 40px; line-height: 1; }

.v-paper .sec-t{ font-family: Fraunces, Georgia, serif; font-size: 26px; font-weight: 400; }
.v-paper .sp-lanes{ gap: 0; }
.v-paper .lane{
  padding: 26px 26px 30px; border: 1px solid var(--hair); margin-right: -1px;
  position: relative; overflow: hidden; transition: border-color .3s ease;
}
.v-paper .lane::after{
  content:""; position: absolute; left: 0; right: 0; bottom: 0; height: 0;
  background: linear-gradient(0deg, rgba(94,107,80,.10), transparent);

}

.v-paper .lane:hover::after{ height: 78px; }

/* ══════════════════════════════════════════════════════════════
   Shared canvas kit — value noise, curl, soft sprites.
   Every engine returns { stop } so switching directions never
   leaves a rAF loop running behind the new specimen.
   ══════════════════════════════════════════════════════════════ */
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function makeNoise(seed){
  const perm = new Uint8Array(512);
  const t = Array.from({length:256}, (_,i)=>i);
  let s = seed >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  for (let i = 255; i > 0; i--){ const j = (rnd() * (i + 1)) | 0; const tmp = t[i]; t[i] = t[j]; t[j] = tmp; }
  for (let i = 0; i < 512; i++) perm[i] = t[i & 255];
  const fade = v => v * v * v * (v * (v * 6 - 15) + 10);
  const lerp = (a, b, v) => a + (b - a) * v;
  const grad = (h, x, y) => ((h & 1) ? x : -x) + ((h & 2) ? y : -y);
  return (x, y) => {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = fade(x), v = fade(y);
    const A = perm[X] + Y, B = perm[X + 1] + Y;
    return lerp(
      lerp(grad(perm[A], x, y),         grad(perm[B], x - 1, y),     u),
      lerp(grad(perm[A + 1], x, y - 1), grad(perm[B + 1], x - 1, y - 1), u),
    v);
  };
}

function softSprite(size, rgb, peak){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const g = c.getContext('2d');
  const r = size / 2;
  const grd = g.createRadialGradient(r, r, 0, r, r, r);
  grd.addColorStop(0,   'rgba(' + rgb + ',' + peak + ')');
  grd.addColorStop(0.4, 'rgba(' + rgb + ',' + (peak * 0.34).toFixed(4) + ')');
  grd.addColorStop(1,   'rgba(' + rgb + ',0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  return c;
}

function fitCanvas(cv){
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h };
}

/* Pointer position in canvas space, shared by the reactive engines. */
function trackPointer(cv){
  const p = { x: -1e4, y: -1e4, px: -1e4, py: -1e4, down: false, active: false };
  const move = e => {
    const r = cv.getBoundingClientRect();
    p.px = p.x; p.py = p.y;
    p.x = e.clientX - r.left; p.y = e.clientY - r.top;
    if (!p.active){ p.px = p.x; p.py = p.y; p.active = true; }
  };
  const leave = () => { p.active = false; p.x = p.y = -1e4; };
  window.addEventListener('pointermove', move, { passive: true });
  window.addEventListener('pointerleave', leave, { passive: true });
  return { p, off(){ window.removeEventListener('pointermove', move); window.removeEventListener('pointerleave', leave); } };
}

/* ── engine 01 · luminous ink: additive blooms on a dark ground ── */
function engineScreen(cv){
  let { ctx, w, h } = fitCanvas(cv);
  const noise = makeNoise(7);
  const jade  = softSprite(140, '125,180,155', 0.30);
  const cyan  = softSprite(180, '110,155,184', 0.24);
  const spark = softSprite(46,  '190,225,210', 0.5);
  const N = REDUCED ? 0 : 640;
  const ps = [];
  const seed = () => ({
    x: Math.random() * w, y: Math.random() * h,
    a: Math.random() * 0.9 + 0.1, r: 0.35 + Math.random() * 0.9,
    life: Math.random(), sp: 0.18 + Math.random() * 0.5,
    kind: Math.random() < 0.34 ? 1 : 0,
  });
  for (let i = 0; i < N; i++) ps.push(seed());
  const drops = [];
  const tr = trackPointer(cv);
  let t = 0, raf = 0, last = 0;

  function frame(now){
    raf = requestAnimationFrame(frame);
    if (now - last < 22) return;      /* soft-cap ~45fps: atmosphere, not a game */
    last = now; t += 0.0016;

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(10,12,11,0.052)';
    ctx.fillRect(0, 0, w, h);

    /* two slow blooms — the "ink lit from behind" ground */
    ctx.globalCompositeOperation = 'lighter';
    const b1x = w * (0.22 + 0.06 * Math.sin(t * 1.7)), b1y = h * (0.16 + 0.05 * Math.cos(t * 1.3));
    const b2x = w * (0.74 + 0.05 * Math.cos(t * 1.1)), b2y = h * (0.30 + 0.04 * Math.sin(t * 1.9));
    ctx.drawImage(cyan, b1x - 330, b1y - 330, 660, 660);
    ctx.drawImage(jade, b2x - 260, b2y - 260, 520, 520);

    /* curl-driven motes */
    const e = 0.0016;
    for (const q of ps){
      const nx = q.x * 0.0022, ny = q.y * 0.0022;
      const cx =  (noise(nx, ny + e) - noise(nx, ny - e)) / (2 * e);
      const cy = -(noise(nx + e, ny) - noise(nx - e, ny)) / (2 * e);
      const m = Math.hypot(cx, cy) || 1;
      q.x += (cx / m) * q.sp; q.y += (cy / m) * q.sp - 0.06;
      q.life += 0.0022;
      if (q.life > 1 || q.x < -40 || q.x > w + 40 || q.y < -40 || q.y > h + 40){
        Object.assign(q, seed()); q.life = 0; q.y = h + 20;
      }
      const fade = Math.sin(q.life * Math.PI);
      const s = (q.kind ? 26 : 15) * q.r;
      ctx.globalAlpha = fade * q.a * (q.kind ? 0.5 : 0.85);
      ctx.drawImage(q.kind ? cyan : jade, q.x - s / 2, q.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;

    /* cursor injects ink that blooms then dissolves */
    if (tr.p.active && !REDUCED){
      const d = Math.hypot(tr.p.x - tr.p.px, tr.p.y - tr.p.py);
      if (d > 1.5 && drops.length < 170){
        drops.push({ x: tr.p.x, y: tr.p.y, r: 4, life: 1, g: Math.min(d * 0.35, 5) });
      }
    }
    for (let i = drops.length - 1; i >= 0; i--){
      const d = drops[i];
      d.r += 0.55 + d.g * 0.1; d.life -= 0.017;
      if (d.life <= 0){ drops.splice(i, 1); continue; }
      ctx.globalAlpha = d.life * d.life * 0.62;
      ctx.drawImage(spark, d.x - d.r, d.y - d.r, d.r * 2, d.r * 2);
    }
    ctx.globalAlpha = 1;
  }

  ctx.fillStyle = '#0A0C0B'; ctx.fillRect(0, 0, w, h);
  if (REDUCED){
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(cyan, w * 0.22 - 330, h * 0.16 - 330, 660, 660);
    ctx.drawImage(jade, w * 0.74 - 260, h * 0.30 - 260, 520, 520);
  } else raf = requestAnimationFrame(frame);

  const onResize = () => { const r = fitCanvas(cv); ctx = r.ctx; w = r.w; h = r.h; ctx.fillStyle = '#0A0C0B'; ctx.fillRect(0, 0, w, h); };
  window.addEventListener('resize', onResize);
  return { stop(){ cancelAnimationFrame(raf); tr.off(); window.removeEventListener('resize', onResize); } };
}

/* ── engine 02 · ink drop: advected particles that wet and dry ── */
function engineDrop(cv){
  let { ctx, w, h } = fitCanvas(cv);
  const noise = makeNoise(23);
  const ink   = softSprite(64, '44,58,70', 0.30);
  const ink2  = softSprite(96, '92,104,96', 0.16);
  const N = REDUCED ? 0 : 900;
  const ps = [];
  const seed = i => ({
    x: Math.random() * w, y: Math.random() * h,
    vx: 0, vy: 0, s: 3 + Math.random() * 16,
    a: 0.16 + Math.random() * 0.5, wet: Math.random(),
    heavy: i % 5 === 0,
  });
  for (let i = 0; i < N; i++) ps.push(seed(i));
  const tr = trackPointer(cv);
  let t = 0, raf = 0, last = 0;

  function frame(now){
    raf = requestAnimationFrame(frame);
    if (now - last < 20) return;
    last = now; t += 0.0012;

    /* the page dries: paper is painted back over the ink, slowly */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(250,248,243,0.030)';
    ctx.fillRect(0, 0, w, h);

    const e = 0.0018;
    const P = tr.p;
    const vx = P.x - P.px, vy = P.y - P.py;
    const speed = Math.hypot(vx, vy);

    for (const q of ps){
      const nx = q.x * 0.0018 + t, ny = q.y * 0.0018;
      const cx =  (noise(nx, ny + e) - noise(nx, ny - e)) / (2 * e);
      const cy = -(noise(nx + e, ny) - noise(nx - e, ny)) / (2 * e);
      const m = Math.hypot(cx, cy) || 1;
      q.vx += (cx / m) * 0.055; q.vy += (cy / m) * 0.055;

      /* the cursor is a stirring finger, not a paintbrush */
      if (P.active && speed > 0.6){
        const dx = q.x - P.x, dy = q.y - P.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < 26000){
          const f = (1 - d2 / 26000) * 0.11;
          q.vx += vx * f; q.vy += vy * f;
          q.wet = Math.min(1, q.wet + 0.05);
        }
      }
      q.vx *= 0.955; q.vy *= 0.955;
      q.x += q.vx; q.y += q.vy;
      q.wet *= 0.9985;

      if (q.x < -60) q.x = w + 60; else if (q.x > w + 60) q.x = -60;
      if (q.y < -60) q.y = h + 60; else if (q.y > h + 60) q.y = -60;

      const s = q.s * (1 + q.wet * 1.5);
      ctx.globalAlpha = q.a * (0.24 + q.wet * 0.76);
      ctx.drawImage(q.heavy ? ink : ink2, q.x - s / 2, q.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    P.px = P.x; P.py = P.y;
  }

  if (REDUCED){
    for (const q of ps.slice(0, 260)){ ctx.globalAlpha = q.a * 0.4; ctx.drawImage(ink2, q.x - q.s, q.y - q.s, q.s * 2, q.s * 2); }
    ctx.globalAlpha = 1;
  } else raf = requestAnimationFrame(frame);

  const onResize = () => { const r = fitCanvas(cv); ctx = r.ctx; w = r.w; h = r.h; };
  window.addEventListener('resize', onResize);
  return { stop(){ cancelAnimationFrame(raf); tr.off(); window.removeEventListener('resize', onResize); } };
}

/* ── engine 03 · brush: a tapered stroke written by the scroll ── */
function brushPath(ctx, pts, width, alpha, col){
  /* Draw a stroke as stacked round caps whose radius follows the
     pressure curve — cheaper and wetter-looking than a single
     variable-width path, and it dry-brushes at the tail for free. */
  for (let i = 0; i < pts.length; i++){
    const u = i / (pts.length - 1);
    const press = Math.sin(Math.pow(u, 0.62) * Math.PI);
    const r = width * (0.16 + press * 0.84);
    if (r <= 0.2) continue;
    const dry = u > 0.72 ? 1 - (u - 0.72) / 0.34 : 1;
    ctx.globalAlpha = alpha * Math.max(0.12, dry);
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(pts[i].x, pts[i].y, r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function engineBrush(heroCv, spineCv, root){
  const noise = makeNoise(11);
  let hero = fitCanvas(heroCv);
  let spine = fitCanvas(spineCv);
  let raf = 0, t0 = 0;

  function heroPts(n){
    const pts = [];
    for (let i = 0; i < n; i++){
      const u = i / (n - 1);
      const x = hero.w * (0.02 + u * 0.86);
      const y = hero.h * (0.52 + 0.16 * Math.sin(u * 2.4 + 0.4)) + noise(u * 3.2, 0.5) * 16;
      pts.push({ x, y });
    }
    return pts;
  }
  const HP = heroPts(320);

  function drawHero(p){
    hero.ctx.clearRect(0, 0, hero.w, hero.h);
    const n = Math.max(2, Math.floor(HP.length * p));
    brushPath(hero.ctx, HP.slice(0, n), 34, 0.16, '#232A2E');
    brushPath(hero.ctx, HP.slice(0, n), 16, 0.13, '#232A2E');
  }

  function spinePts(n){
    const pts = [];
    for (let i = 0; i < n; i++){
      const u = i / (n - 1);
      const x = spine.w * 0.52 + Math.sin(u * 5.1) * spine.w * 0.2 + noise(0.7, u * 4) * 9;
      pts.push({ x, y: u * spine.h });
    }
    return pts;
  }
  let SP = spinePts(360);

  function drawSpine(){
    const el = root;
    const r = el.getBoundingClientRect();
    const total = r.height - window.innerHeight;
    const p = total <= 0 ? 1 : Math.min(1, Math.max(0, -r.top / total));
    spine.ctx.clearRect(0, 0, spine.w, spine.h);
    const n = Math.max(2, Math.floor(SP.length * (0.06 + p * 0.94)));
    brushPath(spine.ctx, SP.slice(0, n), 11, 0.30, '#232A2E');
    brushPath(spine.ctx, SP.slice(0, n), 4.5, 0.22, '#232A2E');
  }

  if (REDUCED){ drawHero(1); }
  else {
    const dur = 1150;
    const step = now => {
      if (!t0) t0 = now;
      const p = Math.min(1, (now - t0) / dur);
      drawHero(1 - Math.pow(1 - p, 3));
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }

  const onScroll = () => drawSpine();
  drawSpine();
  window.addEventListener('scroll', onScroll, { passive: true });
  const onResize = () => {
    hero = fitCanvas(heroCv); spine = fitCanvas(spineCv);
    SP = spinePts(360); drawHero(1); drawSpine();
  };
  window.addEventListener('resize', onResize);
  return { stop(){ cancelAnimationFrame(raf); window.removeEventListener('scroll', onScroll); window.removeEventListener('resize', onResize); } };
}

/* ── engine 04 · landscape: ridgelines that breathe ── */
function engineLand(cv){
  let { ctx, w, h } = fitCanvas(cv);
  const noise = makeNoise(5);
  const LAYERS = 7;
  let raf = 0, t = 0, last = 0;

  function draw(){
    ctx.clearRect(0, 0, w, h);
    for (let L = 0; L < LAYERS; L++){
      const u = L / (LAYERS - 1);
      const base = h * (0.34 + u * 0.62);
      const amp  = h * (0.20 - u * 0.021);
      const freq = 0.0022 + u * 0.0016;
      const alpha = 0.10 + u * 0.30;

      ctx.beginPath();
      ctx.moveTo(-10, h + 10);
      for (let x = -10; x <= w + 10; x += 3){
        const y = base
          - Math.abs(noise(x * freq + L * 12.7, t * (0.24 + u * 0.5))) * amp
          - noise(x * freq * 2.7 + L * 4.1, t * 0.4 + 3) * amp * 0.22;
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w + 10, h + 10);
      ctx.closePath();
      ctx.fillStyle = 'rgba(244,242,235,0.92)';
      ctx.fill();
      ctx.lineWidth = L === LAYERS - 1 ? 1.4 : 0.9;
      ctx.strokeStyle = 'rgba(46,58,52,' + alpha.toFixed(3) + ')';
      ctx.stroke();

      /* hatching in the near valleys — the survey-map register */
      if (L > 3){
        ctx.save();
        ctx.clip();
        ctx.strokeStyle = 'rgba(46,58,52,0.055)';
        ctx.lineWidth = 1;
        for (let x = -h; x < w + h; x += 9){
          ctx.beginPath(); ctx.moveTo(x, h + 10); ctx.lineTo(x + h, -10); ctx.stroke();
        }
        ctx.restore();
      }
    }
  }

  function frame(now){
    raf = requestAnimationFrame(frame);
    if (now - last < 40) return;      /* 25fps is plenty for geology */
    last = now; t += 0.0022;
    draw();
  }

  draw();
  if (!REDUCED) raf = requestAnimationFrame(frame);
  const onResize = () => { const r = fitCanvas(cv); ctx = r.ctx; w = r.w; h = r.h; draw(); };
  window.addEventListener('resize', onResize);
  return { stop(){ cancelAnimationFrame(raf); window.removeEventListener('resize', onResize); } };
}

/* ── engine 05 · damp paper: two washes + wet cursor bleed ── */
function enginePaper(cv){
  let { ctx, w, h } = fitCanvas(cv);
  const sage   = softSprite(200, '94,107,80',  0.10);
  const indigo = softSprite(240, '79,102,117', 0.09);
  const bleed  = softSprite(70,  '79,102,117', 0.17);
  const tr = trackPointer(cv);
  const drops = [];
  let raf = 0, t = 0, last = 0;

  function washes(){
    ctx.clearRect(0, 0, w, h);
    const ax = w * (0.18 + 0.05 * Math.sin(t * 0.9)), ay = h * (0.30 + 0.06 * Math.cos(t * 0.7));
    const bx = w * (0.82 + 0.04 * Math.cos(t * 0.6)), by = h * (0.66 + 0.05 * Math.sin(t * 1.1));
    ctx.drawImage(indigo, ax - 320, ay - 320, 640, 640);
    ctx.drawImage(sage,   bx - 270, by - 270, 540, 540);
  }

  function frame(now){
    raf = requestAnimationFrame(frame);
    if (now - last < 33) return;
    last = now; t += 0.0011;
    washes();

    if (tr.p.active){
      const d = Math.hypot(tr.p.x - tr.p.px, tr.p.y - tr.p.py);
      if (d > 6 && drops.length < 60) drops.push({ x: tr.p.x, y: tr.p.y, r: 5, life: 1 });
      tr.p.px = tr.p.x; tr.p.py = tr.p.y;
    }
    for (let i = drops.length - 1; i >= 0; i--){
      const d = drops[i];
      d.r += 0.9; d.life -= 0.0135;
      if (d.life <= 0){ drops.splice(i, 1); continue; }
      ctx.globalAlpha = d.life * 0.85;
      ctx.drawImage(bleed, d.x - d.r, d.y - d.r, d.r * 2, d.r * 2);
    }
    ctx.globalAlpha = 1;
  }

  washes();
  if (!REDUCED) raf = requestAnimationFrame(frame);
  const onResize = () => { const r = fitCanvas(cv); ctx = r.ctx; w = r.w; h = r.h; washes(); };
  window.addEventListener('resize', onResize);
  return { stop(){ cancelAnimationFrame(raf); tr.off(); window.removeEventListener('resize', onResize); } };
}

/* ══════════════════════════════════════════════════════════════
   Switcher
   ══════════════════════════════════════════════════════════════ */
const tabsEl  = document.getElementById('tabs');
const specEl  = document.getElementById('spec');
const stageEl = document.getElementById('stage');
const notesEl = document.getElementById('notes');
const notesH  = document.getElementById('notesH');
let live = [];

DIRS.forEach((d, i) => {
  const b = document.createElement('button');
  b.className = 'tab';
  b.type = 'button';
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  b.innerHTML = '<span class="tab-no">' + d.no + '</span><span class="tab-zh">' + d.zh + '</span>';
  b.addEventListener('click', () => show(i));
  tabsEl.appendChild(b);
});

function show(i){
  const d = DIRS[i];
  live.forEach(e => e.stop());
  live = [];

  [...tabsEl.children].forEach((t, j) => t.setAttribute('aria-selected', j === i ? 'true' : 'false'));

  specEl.innerHTML = d.spec.map(([k, v]) =>
    '<div class="spec-cell"><div class="spec-k">' + k + '</div><div class="spec-v">' + v + '</div></div>'
  ).join('');

  stageEl.innerHTML = SPECIMENS[d.id]();

  notesH.textContent = d.no + ' · ' + d.zh + ' ' + d.en + ' — 要做出这个效果，需要什么';
  notesEl.innerHTML = d.notes.map(([k, v]) =>
    '<div class="note"><div class="note-i">' + k + '</div><p class="note-b">' + v + '</p></div>'
  ).join('');

  /* canvases only exist after markup lands, so wire engines here */
  requestAnimationFrame(() => {
    const q = s => stageEl.querySelector(s);
    if (d.id === 'screen') live.push(engineScreen(q('[data-engine="screen"]')));
    if (d.id === 'drop')   live.push(engineDrop(q('[data-engine="drop"]')));
    if (d.id === 'paper')  live.push(enginePaper(q('[data-engine="paper"]')));
    if (d.id === 'land')   live.push(engineLand(q('[data-engine="land"]')));
    if (d.id === 'brush')  live.push(engineBrush(q('[data-engine="brush-hero"]'), q('[data-engine="brush-spine"]'), q('#brushRoot')));
  });

  window.scrollTo({ top: 0, behavior: 'auto' });
}

show(0);
</script>
